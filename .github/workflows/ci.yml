name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SVBT
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: SVBT/package.json
          cache: npm
          cache-dependency-path: SVBT/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
